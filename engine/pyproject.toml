[project]
name = "airlock-engine"
version = "0.1.0"
description = "Airlock local privacy engine: offline extraction, detection, policy, masking and verification."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Airlock" }]
# Phase 1 runtime is standard-library only. Format, OCR and NER dependencies
# arrive with the phases that use them (see docs/ARCHITECTURE.md §Dependencies).
dependencies = []

[project.scripts]
airlock-engine = "airlock_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "subprocess: spawns the real engine process over stdio",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20", "SIM", "RUF"]
ignore = [
    "S101", # assert is fine in tests and invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["airlock_engine"]
