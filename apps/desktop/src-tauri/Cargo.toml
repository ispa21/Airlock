[package]
name = "airlock-desktop"
version = "0.1.0"
description = "Airlock desktop host: window, engine supervisor and IPC bridge"
authors = ["Airlock"]
license = "Proprietary"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "airlock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.55"
